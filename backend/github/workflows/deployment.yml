name: Deploy Sports Proctor API

on:
  push:
    branches:
      - main  # Jab main branch pe push hoga tab deploy hoga

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements2.txt

      # Agar aap Render use kar rahe hain toh ye step add karein
      - name: Deploy to Render
        if: success()
        run: |
          curl ${{ secrets.RENDER_DEPLOY_HOOK_URL }}