[build-system]
requires = ["briefcase-core>=0.3.15"]

[project]
name = "sports-proctor"
version = "0.1.0"
description = "AI-powered sports performance testing and proctoring system"
authors = [{name = "Srishti", email = "srishti@example.com"}]
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "PyQt6>=6.5.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "pyttsx3>=2.90",
    "pyaudio>=0.2.13",
    "pygame>=2.2.0",
    "pandas>=2.0.0",
    "ultralytics>=8.0.0",
    "PyQt6-WebEngine>=6.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "motor>=3.3.0",
    "matplotlib>=3.7.0",
    "typing_extensions>=4.7.0",
    "requests>=2.31.0"
]

[tool.briefcase]
project_name = "Sports Proctor"
bundle = "com.srishti"
version = "0.1.0"
description = "AI-powered sports performance testing and proctoring system"
url = "https://github.com/Srishti-1806/Sports_proctored"

[tool.briefcase.app.sports_proctor]
formal_name = "Sports Proctor"
description = "AI-powered sports performance testing and proctoring system"
bundle = "com.srishti"
url = "https://github.com/Srishti-1806/Sports_proctored"
author = "Srishti"
author_email = "srishti@example.com"
home_page = "https://github.com/Srishti-1806/Sports_proctored"
license = "MIT"
sources = ["src/sports_proctor"]
requires = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "PyQt6>=6.5.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "pyttsx3>=2.90",
    "pyaudio>=0.2.13",
    "pygame>=2.2.0",
    "pandas>=2.0.0",
    "ultralytics>=8.0.0",
    "PyQt6-WebEngine>=6.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "motor>=3.3.0",
    "matplotlib>=3.7.0",
    "typing_extensions>=4.7.0",
    "requests>=2.31.0"
]

[tool.briefcase.app.sports_proctor.windows]
requires = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "PyQt6>=6.5.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "pyttsx3>=2.90",
    "pyaudio>=0.2.13",
    "pygame>=2.2.0",
    "pandas>=2.0.0",
    "ultralytics>=8.0.0",
    "PyQt6-WebEngine>=6.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "motor>=3.3.0",
    "matplotlib>=3.7.0",
    "typing_extensions>=4.7.0",
    "requests>=2.31.0",
    "WMI"
]
